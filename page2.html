<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For My Chello ❤️</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <section class="page2">

        <main class="photo-container">

            <h1 class="page2-title">
                One More Thing... 💗
            </h1>

            <p class="page2-text">
                This picture reminds me of you ❤️
            </p>

            <div class="photo-box">

                <!-- YOUR IMAGE -->
                <img
                    src="./images/chello.png"
                    alt="Chello"
                    class="main-photo"
                >

                <!-- Cute mouse -->
                <div class="cute-mouse">
                    🐭
                </div>

                <!-- Heart -->
                <div class="mouse-heart">
                    ❤️
                </div>

            </div>

            <p class="love-text">
                I hope this little surprise makes you smile 🥺❤️
            </p>

            <button
                class="next-button"
                onclick="goToPage3()">
                One Last Thing 💕
            </button>

        </main>

    </section>

    <script src="./script.js"></script>

</body>

</html>
