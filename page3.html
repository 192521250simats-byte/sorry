<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Did You Accept My Apology? ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="page3">

        <main class="question-container">

            <div class="top-heart">
                ❤️
            </div>

            <h1>
                Did you accept<br>
                my apology?
            </h1>

            <p class="question-text">
                Please choose honestly 🥺
            </p>

            <div class="answer-buttons">

                <button
                    class="yes-button"
                    onclick="answerYes()">
                    YES ❤️
                </button>

                <button
                    class="no-button"
                    onclick="answerNo()">
                    NO 💔
                </button>

            </div>

            <div class="notification-box">

                <div class="phone-icon">
                    📱
                </div>

                <p>
                    Your answer will open WhatsApp<br>
                    so you can send your answer.
                    <br><br>
                    <strong>8870602160</strong>
                </p>

            </div>

            <div class="bottom-line">
                ❤️ Sorry Chello ❤️
            </div>

            <h2>
                No matter what...
            </h2>

            <p class="final-message">
                You are very special to me. 🥺❤️
            </p>

        </main>

    </section>

    <script src="script.js"></script>

</body>
</html>
